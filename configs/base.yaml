# 共通設定（02_基本設計書 5節 / 8節、01_要件定義書 NFR-5 対応）
# 環境依存の値はすべてここに外出しし、コードにハードコードしない。

project:
  name: dcct-reproduction
  # 全実験で共通の乱数シード（データ分割・モデル初期化・パッチサンプリングに適用）
  seed: 42

paths:
  # 外部SSD「Extreme Pro」のマウントポイント。パスに空白を含むため必ずクォートすること。
  # 生成器のZIP／フォルダ（genimage-*.zip, BigGAN/ など）が直接置かれている階層を指す。
  # 実際のマウント名は `ls /Volumes` で確認すること（同名ディスクがあると
  # "Extreme Pro 1" のように連番が付く）。
  dataset_root: "/Volumes/Extreme Pro"
  db_path: "db/dcct_metadata.sqlite3"
  checkpoint_root: "checkpoints"
  # 各コマンドの実行ログをこの下にも残す（ターミナルを閉じても後から追えるように）
  log_root: "logs"
  # `report` コマンドの既定の出力先
  report_root: "reports"

device:
  # auto = cuda -> mps -> cpu の順に自動選択（03_詳細設計書 7.5、02_基本設計書 9節）
  # 明示指定する場合は cuda / mps / cpu を直接書く。torch.cuda.* には依存しない実装とする。
  type: auto
  # MPS未対応演算をCPUへ自動フォールバックさせる（macOS実行時のみ意味を持つ）
  enable_mps_fallback: true

dataset:
  name: GenImage
  # 【OI-1】Midjourneyは未取得のため、当面すべての学習・評価から除外する。
  # データ取得後はこのリストを空にするだけで8生成器のTable1再現に復帰できる。
  excluded_generators:
    - Midjourney
  # 学習に用いる生成器（論文プロトコル：SDv1.4のみで学習）
  train_generators:
    - SDv1.4
  # cross-generator評価対象（excluded_generators に含まれるものは自動でスキップ）
  eval_generators:
    - Midjourney
    - SDv1.4
    - SDv1.5
    - ADM
    - GLIDE
    - Wukong
    - VQDM
    - BigGAN


  # ---- ingest（データ取り込み）設定 ----
  # dataset_root からの相対パス。ZIPでもディレクトリでも同じインタフェースで走査する。
  # type:  auto（拡張子から判定） | zip | dir
  # probe: 画像ヘッダを読んで width/height と破損を判定するか。省略時はZIPのみ有効。
  #        exFATの外部SSDでは、巨大なディレクトリを1ファイルずつ stat すると
  #        後ろへ行くほど遅くなるため、ディレクトリ形式では既定で無効にしている
  sources:
    - { name: SDv1.4, path: "genimage-stable-diffusion-v1-4.zip", category: diffusion, type: auto }
    - { name: SDv1.5, path: "stable_diffusion_v_1_5",             category: diffusion, type: auto }
    - { name: ADM,    path: "genimage-adm.zip",                   category: diffusion, type: auto }
    - { name: Wukong, path: "genimage-wukong.zip",                category: diffusion, type: auto }
    - { name: GLIDE,  path: "imagenet_glide",                     category: diffusion, type: auto }
    - { name: VQDM,   path: "VQDM",                               category: diffusion, type: auto }
    # 10/17: 外付けSSDの整理で BigGAN/imagenet_ai_0419_biggan が一番上に移されたので、場所を合わせた
    #（DB の images.filepath も同じく書き換え済み。もとは path: "BigGAN"）
    - { name: BigGAN, path: "imagenet_ai_0419_biggan",            category: gan,       type: auto }
    # 【OI-1】取得しない方針。generatorsマスタには残すが走査・評価の対象外
    #（後日入手した場合は path を設定し、excluded_generators から外すだけでよい）
    - { name: Midjourney, path: "",                               category: diffusion, type: auto }

  # nature/（実写ImageNet画像）をどの generator に紐づけるか
  #   per_source: 生成器ごとに 'ImageNet(real)@<生成器名>' を作る（既定）
  #               → cross-generator評価で「その生成器に対応する実写セット」を一意に引ける
  #   shared:     全生成器の nature/ をまとめて単一の 'ImageNet(real)' に紐づける
  real_generator_naming: per_source

  # GenImageは train/ と val/ しか持たないため、DBの split へ以下のように割り当てる
  split:
    # GenImage の val/ を test split として登録する（Table 1評価に使う）
    source_val_as: test
    # train/ から切り出して val split に回す比率（閾値τのチューニング・チェックポイント選択用）
    # 割当は seed とファイルパスのハッシュで決まるため、再実行しても同じ結果になる
    val_ratio_from_train: 0.05

  # ディレクトリ名の別名（GenImageの配布物により表記ゆれがあるため）
  directory_aliases:
    ai: [ai, fake, sdv4, imagenet_ai]
    real: [nature, real, imagenet_real]
    train: [train]
    val: [val, validation]
preprocess:
  # 03_詳細設計書 1.1 パラメータ一覧
  patch_size: 64            # s
  num_highpass_filters: 30  # M
  truncation_t: 7           # t
  use_cfa_mask: true        # Ablation-B で false に切替（ランダムRGB選択マスクになる）
  use_high_pass: true       # Ablation-B で false に切替（素通し）
  bayer_pattern: RGGB       # RGGB / BGGR / GRBG / GBRG
  # SRMと同じく残差を丸めてから[-t,t]にクリップし、{-t,...,t}の離散値にする。
  # 条件付きモデルの尤度を離散化ロジスティック混合（PixelCNN++）で書くための前提。
  quantize_residual: true
  # 丸める前に残差を何倍するか（論文に記載なし）。1 が今まで通り（1刻み）。
  # 2 なら元の値で 0.5 刻みになる。truncation_t は倍率をかけた後の値で書く（範囲 ±2 を 0.5 刻みなら t=4）
  residual_scale: 1
  # ハイパスフィルタのかけ方（論文に記載なし。src/preprocess/pipeline.py の説明を参照）
  #   mosaic（既定）: 色が混ざったモザイクにそのままかける
  #   sublattice:     2×2 の位置ごとの格子に分け、同じ色の画素どうしでかける
  #   per_color:      R・G・B それぞれにかけてから、Bayer の位置で選ぶ
  filter_mode: mosaic

augmentation:
  # FR-10: 学習時のベナイン摂動
  jpeg:
    enabled: true
    probability: 0.05
    quality_min: 70
    quality_max: 100
  # 学習で AI画像だけを JPEG にする（品質は min〜max からランダム）。GenImage は本物が JPEG、
  # AI画像が PNG なので、形式の差で見分けないようにする（実験15、Stage II だけで使う）
  ai_jpeg:
    enabled: false
    quality_min: 70
    quality_max: 95
  # 学習で本物だけを PIL の JPEG にかけ直す（実験17、Stage II だけで使う）。ai_jpeg と合わせて使うと、
  # 本物も AI画像も「最後に同じ PIL の JPEG を通った画像」になり、確認7 の評価と同じ条件で学習できる
  real_jpeg:
    enabled: false
    quality_min: 70
    quality_max: 95

model:
  conditional_unet:
    num_mixtures: 10        # K
    base_channels: 64
    # 縮小（MaxPool）の回数。2 は従来の構成（約190万パラメータ）。
    # 4 にすると標準の U-Net（幅 64→1024、約3,100万パラメータ）。patch_size は 2^depth で割り切れること
    depth: 2
    # 予測対象 y' の作り方。
    # 論文 Algorithm 1 line 8 が x' と同じく
    #   y' ← TRUNCATE(STACK({h_m * y}_{m=1..M}), -t, t)
    # としているため、30種すべてを y に適用した 60ch（filter_bank）が論文準拠。
    #   filter_bank:   30種すべてを y に適用し 60ch（既定・論文準拠）
    #   single_filter: target_filter の1種類のみ適用し 2ch に保つ（比較用）
    target_mode: filter_bank
    target_filter: square5x5

    # 混合分布パラメータを画素ごとに1組持つか、チャンネルごとに持つか。
    #   per_pixel（既定・論文準拠）: 論文 Algorithm 1 line 10 は
    #     Π_(i,j) Σ_k w_k(i,j)·LOGISTIC(y'(i,j)|μ_k(i,j), s_k(i,j))
    #     とパラメータを画素位置のみで添字付けしており、混合分布は画素ごとに1つ。
    #     特徴は 3K = 30ch/モデル、pθ・qφ連結で60ch（03_詳細設計書 1.3節と一致）
    #   per_channel: チャンネルごとに独立した混合分布を持つ。y'が60chだと特徴が
    #     3*K*60 = 1800ch/モデルになり、分類器入力3600chは現実的でない
    mixture_scope: per_pixel
  classifier:
    resnet_blocks: 4
    transformer_layers: 2
    # 【OI-2 確定】論文 Algorithm 1 が line 9 で f_θ(x') を混合分布パラメータと定義し、
    # line 32 で g_ψ(CONCAT(f_θ(x'), f_φ(x'))) としているため案Aで確定。
    # mixture_scope=per_pixel と合わせ、3K = 30ch/モデル、連結で60chとなる。
    feature_source: mixture_params   # mixture_params | bottleneck（案B）

train:
  optimizer: adam
  learning_rate: 1.0e-4
  batch_size: 16
  num_workers: 4
  num_epochs: 20
  save_every_epoch: 1
  resume_from: null
  # 再開時に学習率を上書きする値（null = チェックポイントに保存された lr をそのまま使う）。
  # 再開すると optimizer の状態ごと lr も戻るため、learning_rate を変えても効かない
  resume_learning_rate: null
  # NLL損失の集約方法。mean(既定) / sum / sum_per_sample
  nll_reduction: mean
  # 1エポックあたりのステップ数上限（null = 制限なし）。スモークテストや時間見積りに使う
  max_steps_per_epoch: null
  # 検証時のステップ数上限（null = val split全体）
  max_eval_steps: null

data:
  # 1回の学習で使う画像枚数の上限（null = 全件）。Apple Siliconでの学習時間に応じて調整する
  max_images: null

inference:
  num_patches: 16           # P
  threshold: 0.5            # τ の初期値。val上でYouden指数最大化によりチューニングする
  zero_features: null       # 確認イ: photo / ai を指定すると、判定のときにそのモデルの出力を 0 にする

evaluate:
  # 評価に使う分類器チェックポイント（--run-id を指定した場合はDBから自動解決される）
  classifier_checkpoint: null
  # val split上でYouden指数を最大化する閾値τを求めてから評価する（03_詳細設計書 7.3）
  tune_threshold: true
  # 1生成器あたりの評価枚数上限（null = 全件）
  max_images_per_generator: null
  robustness:
    # Figure 6相当。JPEG品質係数と空間ダウンサンプリング倍率
    jpeg_qualities: [100, 90, 80, 70]
    downsample_ratios: [0.9, 0.8, 0.7, 0.6]
    # 劣化条件ごとにτを較正し直すか。
    #   false（既定）: Algorithm 2 どおり、クリーンなvalで決めた単一のτを全条件に使う
    #   true:          同じ劣化を通したvalで条件ごとにτを取り直す
    # 既定のfalseでは、劣化でスコア分布がずれた条件は全件が閾値の片側に寄り、
    # 識別力が残っていてもAccuracyが0.5まで落ちる（AUCと併せて読むこと）。
    # trueにすると8条件ぶん較正が走るので、評価時間が1時間ほど延びる。
    recalibrate_threshold: false
  ai_jpeg:
    # `dcct evaluate --mode ai_jpeg`（AI画像だけ JPEG にして判定）の線（閾値）の決め方。
    #   false（既定）: 圧縮しない val で決める。正解率は参考にならない（AUC を見る）
    #   true:          品質ごとに、AI画像も同じ品質の JPEG にした val で決め直す。論文と並べられる正解率になる。
    #                  結果は perturbation_type='ai_jpeg_recal' として保存し、ふつうの ai_jpeg とは混ざらない
    recalibrate_threshold: false
  one_class:
    # 一クラス検出（DCCT†、`dcct evaluate-one-class`）の閾値を決めるのに使う学習用の写真の枚数。
    # 閾値はそのスコアの95パーセンタイル（論文 Appendix B）。全件15万枚は時間がかかるので絞る
    num_calibration_images: 2000
    # 1回に処理する画像の枚数。画像数 × 16パッチ × 15値 × K=10 の確率表を作るので、
    # 学習時の batch_size より小さくしてメモリを抑える
    batch_size: 4
    # AI画像だけをこの品質の JPEG にしてから評価する（null なら何もしない）。GenImage は本物が JPEG、
    # AI画像が PNG なので、形式の差で見分けていないかを確かめるのに使う（`--ai-jpeg-quality` でも指定できる）
    ai_jpeg_quality: null
