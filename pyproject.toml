[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcct-reproduction"
version = "0.1.0"
description = "DCCT (Color Matters) 再現実装"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pillow>=10.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

# 02_基本設計書 6節のコマンド形式（dcct ingest ...）をそのまま使えるようにする
[project.scripts]
dcct = "src.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["src*"]
